<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP 与原来的无框架界面同样严格,只多一条:style-src 里有一个构建期生成的 nonce。
      Ant Design 5 用 CSS-in-JS 往页面注入 <style>,没有 nonce 会被 'self' 拦掉;
      nonce 每次构建随机生成(vite.config.ts),主进程读同一份,响应头里的 CSP 与这里保持一致。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'nonce-__CSP_NONCE__'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="csp-nonce" nonce="__CSP_NONCE__" />
    <title>Dafri Trading</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
