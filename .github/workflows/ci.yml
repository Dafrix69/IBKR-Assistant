name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,broker,futu]"
      - run: python -m pytest -q

  engine-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine-ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # 定位阶段:逐个文件跑,失败文件的输出末尾各写一条 annotation(公开仓库不用登录就能从 check-runs API 读)
      - run: |
          set +e
          fails=""
          for f in tests/*.spec.ts; do
            out=$(npx vitest run "$f" 2>&1); rc=$?
            if [ $rc -ne 0 ]; then
              fails="$fails $f"
              echo "$out" | tail -n 45 > "fail-$(basename "$f").log"
            fi
          done
          if [ -n "$fails" ]; then
            for f in $fails; do
              msg=$(sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' "fail-$(basename "$f").log" | awk '{printf "%s%%0A", $0}' | tail -c 3500)
              echo "::error title=vitest $f::$msg"
            done
            exit 1
          fi
