name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 13 要 Node >= 22(Node 20 上预编译包直接段错误);桌面端开发机与 Electron 40 内置的都是 Node 24
          node-version: 24
          cache: npm
          cache-dependency-path: engine-ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      # 模块边界(依赖只能往下流),规则在 engine-ts/.dependency-cruiser.cjs
      - run: npm run depcruise
      - run: npx tsc --noEmit
      # 失败时把输出末尾写成一条 annotation:公开仓库不用登录就能从 check-runs API 读到
      - run: |
          set -o pipefail
          npx vitest run 2>&1 | tee vitest.log || {
            msg=$(tail -n 60 vitest.log | sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' | awk '{printf "%s%%0A", $0}' | tail -c 3500)
            echo "::error title=vitest::$msg"
            exit 1
          }

  # React 壳:只做类型检查与 Vite 构建,不下载 Electron 二进制、不打包
  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run depcruise
      - run: npm run ui:typecheck
      - run: npm run ui:build
