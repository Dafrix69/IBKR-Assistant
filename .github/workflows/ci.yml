name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,broker,futu]"
      - run: python -m pytest -q

  engine-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 13 要 Node >= 22(Node 20 上预编译包直接段错误);桌面端开发机与 Electron 40 内置的都是 Node 24
          node-version: 24
          cache: npm
          cache-dependency-path: engine-ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # 失败时把输出末尾写成一条 annotation:公开仓库不用登录就能从 check-runs API 读到
      - run: |
          set -o pipefail
          npx vitest run 2>&1 | tee vitest.log || {
            msg=$(tail -n 60 vitest.log | sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' | awk '{printf "%s%%0A", $0}' | tail -c 3500)
            echo "::error title=vitest::$msg"
            exit 1
          }
