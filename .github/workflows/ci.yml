name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,broker,futu]"
      - run: python -m pytest -q

  engine-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine-ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # 失败时把最后 80 行输出塞进一条 annotation:公开仓库不用登录就能从 check-runs API 读到
      - run: |
          set -o pipefail
          npx vitest run --reporter=default --reporter=github-actions 2>&1 | tee vitest.log || {
            echo "::error title=vitest::$(tail -n 80 vitest.log | sed 's/\[[0-9;]*m//g' | sed ':a;N;$!ba;s/
/%0A/g' | cut -c1-6000)"
            exit 1
          }
