name: ci

on:
  push:
    branches: [main]
  pull_request:

# 这条工作流只读代码:不发版、不写仓库。令牌权限收到最小
permissions:
  contents: read

jobs:
  engine-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # better-sqlite3 13 要 Node >= 22(Node 20 上预编译包直接段错误);桌面端开发机与 Electron 内置的都是 Node 24
          node-version: 24
          cache: npm
          cache-dependency-path: engine-ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      # 模块边界(依赖只能往下流),规则在 engine-ts/.dependency-cruiser.cjs
      - run: npm run depcruise
      - run: npx tsc --noEmit
      # 失败时把输出末尾写成一条 annotation:公开仓库不用登录就能从 check-runs API 读到
      - run: |
          set -o pipefail
          npx vitest run 2>&1 | tee vitest.log || {
            msg=$(tail -n 60 vitest.log | sed -r 's/\x1b\[[0-9;]*[A-Za-z]//g' | awk '{printf "%s%%0A", $0}' | tail -c 3500)
            echo "::error title=vitest::$msg"
            exit 1
          }

  # 用户的机器是 macOS 和 Windows,测试却一直只在 Linux 上跑:路径分隔符、文件锁、rename 覆盖、凭证库这些
  # 平台相关的地方(配置的原子写、交易库的备份与恢复、keychain)只有在那两个平台上跑才验得到。
  # 两个平台都必过(2026-09-28 起)。原来打算先观察两周、不挡合并:macOS 一次就绿;Windows 第一次红了十条,
  # 全是测试自己的事(文件锁、CRLF、信号),修完就绿了。用户定的不再等。
  engine-ts-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine-ts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # React 壳:只做类型检查与 Vite 构建,不下载 Electron 二进制、不打包
  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            engine-ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run depcruise
      - run: npm run ui:typecheck
      - run: npm run ui:build
      # 随包发出去的开源组件:许可都得在白名单里(tools/gen_notices.js)。引擎那一半要读它的 node_modules
      - run: npm ci
        working-directory: engine-ts
      - run: npm run notices:check

  # 已公开的安全通告:只查真的随安装包发出去的那些(生产依赖),high 及以上就红。
  # 构建工具链(electron-builder、eslint…)里的通告不在这里挡:它们不进安装包,由 Dependabot 跟着升。
  # Electron 是开发依赖却随包发出去,单独查它这一个。
  audit:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 引擎的生产依赖
        working-directory: engine-ts
        run: npm audit --omit=dev --audit-level=high
      - name: 主进程的生产依赖
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high
      - name: Electron 本身
        working-directory: desktop
        run: |
          npm audit --json > audit.json || true
          node -e "
            const a = require('./audit.json');
            const v = (a.vulnerabilities || {}).electron;
            if (v && ['high', 'critical'].includes(v.severity)) {
              console.error('::error::Electron 有 ' + v.severity + ' 级的安全通告(受影响范围 ' + v.range + '),请升级');
              process.exit(1);
            }
            console.log('Electron 没有 high 及以上的通告');
          "
