name: 安装包

# macOS(DMG,Apple Silicon)与 Windows(NSIS,x64)安装包。
#   - 手动:Actions → 安装包 → Run workflow(或 gh workflow run package.yml --ref main)
#   - 推 v* 标签:两个包一起出,跑完自动挂到对应的 Release
#   - 改到打包相关文件的 PR(含两个工程的依赖清单,Dependabot 的升级也算):先打一遍,确认还能出包
# 每次运行的产物都在 Artifacts 里(IBKR-Assistant-mac-arm64 / IBKR-Assistant-win-x64),保留 30 天;
# 打标签的那次还会发到 Releases。签名:
#   macOS:仓库 Secrets 配了 Developer ID 证书(MAC_CERT_P12_BASE64 等,见 dmg 任务)就签名 + 公证,双击即开;
#          没配就是 ad-hoc、未公证,首次打开到「系统设置 → 隐私与安全性」点「仍要打开」,或 xattr -dr com.apple.quarantine "/Applications/IBKR-Assistant.app"
#   Windows 没有证书,会弹 SmartScreen,「更多信息 → 仍要运行」

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/package.yml'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      # 引擎的生产依赖整包进安装包:它们升了版本,要看装出来的应用还起不起得来
      - 'engine-ts/package.json'
      - 'engine-ts/package-lock.json'
      - 'desktop/build/**'
      - 'desktop/tools/stage_engine_ts.js'
      - 'desktop/tools/smoke_engine_ts.js'
      - 'desktop/tools/dist_mac.js'
      - 'desktop/tools/gen_notices.js'
      - 'desktop/tools/check_release.js'

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    # macos-latest 是 Apple Silicon,和 dist:mac 的 --arm64 一致;原生模块(better-sqlite3、@napi-rs/keyring)按本机平台装
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # package.json 里 mac.identity 为 "-":ad-hoc 签名。别让 electron-builder 去钥匙串里自动找证书
      # (签名版按 Team ID 显式指定身份,也不靠自动发现)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 仓库 Secrets 里配了 Developer ID 证书就出签名 + 公证的包,没配照旧 ad-hoc。要配的六个:
      #   MAC_CERT_P12_BASE64  「Developer ID Application」证书连私钥导出的 .p12,base64 -i cert.p12 | pbcopy
      #   MAC_CERT_PASSWORD    导出 .p12 时设的密码
      #   APPLE_TEAM_ID        10 位 Team ID
      #   APPLE_API_KEY_P8     App Store Connect API 密钥(.p8 文件的全文)
      #   APPLE_API_KEY_ID     那把密钥的 Key ID
      #   APPLE_API_ISSUER     Issuer ID(App Store Connect → 用户和访问 → 集成 页面顶上)
      HAS_DEVELOPER_ID: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 与 ci.yml 一致:better-sqlite3 13 要 Node >= 22,Electron 40 内置的也是 Node 24
          node-version: 24
          cache: npm
          cache-dependency-path: |
            engine-ts/package-lock.json
            desktop/package-lock.json

      - name: 装引擎依赖
        working-directory: engine-ts
        run: npm ci

      - name: 装桌面端依赖(含 Electron 二进制,冒烟要用)
        working-directory: desktop
        run: npm ci

      # PR 上一律 ad-hoc:证书不暴露给 PR,也不为每个 PR 排一次公证
      - name: 打包 DMG(界面构建 → 暂存引擎 → 冒烟 → electron-builder)
        if: env.HAS_DEVELOPER_ID != 'true' || github.event_name == 'pull_request'
        working-directory: desktop
        run: npm run dist:mac

      - name: 打包 DMG(同上,Developer ID 签名 + 公证,最后按 Gatekeeper 口径自验)
        if: env.HAS_DEVELOPER_ID == 'true' && github.event_name != 'pull_request'
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # notarytool 要的是 .p8 文件路径,Secret 里存的是文件内容
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" npm run dist:mac:signed

      - name: 核对安装包:DMG 完整、主程序与引擎原生模块都是 arm64
        working-directory: desktop
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          APP="dist/mac-arm64/IBKR-Assistant.app"
          echo "DMG: $DMG($(du -h "$DMG" | cut -f1))"
          hdiutil verify "$DMG"
          # 架构判断不走 "| grep -q":开着 pipefail 时 grep 提前退出会让上游吃 SIGPIPE,被误判成失败
          archs=$(lipo -archs "$APP/Contents/MacOS/IBKR-Assistant")
          echo "主程序: $archs"
          [[ " $archs " == *" arm64 "* ]] || { echo "::error::主程序不是 arm64:$archs"; exit 1; }
          # 逐个读 find 的输出,不能 for f in $(find …):产物名本身没空格了,但上层路径仍可能有
          count=0
          while IFS= read -r -d '' f; do
            archs=$(lipo -archs "$f")
            echo "${f#"$APP/"}: $archs"
            [[ " $archs " == *" arm64 "* ]] || { echo "::error::原生模块不是 arm64:$f"; exit 1; }
            count=$((count + 1))
          done < <(find "$APP/Contents/Resources/engine-ts/node_modules" -name '*.node' -print0)
          [ "$count" -gt 0 ] || { echo "::error::安装包里一个原生模块都没有,暂存步骤可能漏了"; exit 1; }
          codesign -dv "$APP" 2>&1 || true

      - name: 用安装包里的 Electron 拉起安装包里的引擎
        working-directory: desktop
        run: |
          APP="$PWD/dist/mac-arm64/IBKR-Assistant.app"
          DAFRI_PROMPT_DIR="$APP/Contents/Resources/engine/prompts" \
            node tools/smoke_engine_ts.js "$APP/Contents/Resources/engine-ts" --runner "$APP/Contents/MacOS/IBKR-Assistant"

      - name: 启动应用 30 秒:不闪退,主进程拉起了引擎
        working-directory: desktop
        run: |
          set -uo pipefail
          APP="$PWD/dist/mac-arm64/IBKR-Assistant.app"
          # DAFRI_SKIP_MOVE:不弹"移到应用程序"的对话框(那是从 DMG 里双击运行时才该有的)
          DAFRI_SKIP_MOVE=1 "$APP/Contents/MacOS/IBKR-Assistant" > app.log 2>&1 &
          pid=$!
          engine=0
          for i in $(seq 1 30); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::应用在第 ${i} 秒退出"
              cat app.log
              exit 1
            fi
            pgrep -f "engine-ts/dist/src/cli.js rpc" >/dev/null && engine=1
          done
          kill "$pid" 2>/dev/null || true
          LOG="$HOME/Library/Application Support/IBKR-Assistant/logs/main.log"
          if [ -f "$LOG" ]; then echo "--- main.log"; tail -40 "$LOG"; fi
          if [ "$engine" != 1 ]; then echo "::error::30 秒内没看到引擎子进程"; exit 1; fi
          echo "应用存活 30 秒,引擎子进程已起来"

      - uses: actions/upload-artifact@v7
        with:
          name: IBKR-Assistant-mac-arm64
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.dmg.blockmap
          retention-days: 30
          if-no-files-found: error

  exe:
    # windows-latest 出 NSIS 安装器(dist:win 的 --x64);原生模块按本机平台装
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 与 ci.yml 一致:better-sqlite3 13 要 Node >= 22,Electron 40 内置的也是 Node 24
          node-version: 24
          cache: npm
          cache-dependency-path: |
            engine-ts/package-lock.json
            desktop/package-lock.json

      - name: 装引擎依赖
        working-directory: engine-ts
        run: npm ci

      - name: 装桌面端依赖(含 Electron 二进制,冒烟要用)
        working-directory: desktop
        run: npm ci

      - name: 打包 EXE(界面构建 → 暂存引擎 → 冒烟 → electron-builder)
        working-directory: desktop
        run: npm run dist:win

      - name: 核对安装包:安装器在,解包目录里只有 win32-x64 的原生模块
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::没有出 exe"; exit 1 }
          "安装器: $($exe.Name)($([math]::Round($exe.Length / 1MB)) MB)"
          $app = (Resolve-Path dist/win-unpacked).Path
          $nodes = @(Get-ChildItem "$app\resources\engine-ts\node_modules" -Recurse -Filter *.node)
          if ($nodes.Count -eq 0) { Write-Host "::error::安装包里一个原生模块都没有,暂存步骤可能漏了"; exit 1 }
          foreach ($n in $nodes) { "$($n.FullName.Substring($app.Length + 1)): $([math]::Round($n.Length / 1KB)) KB" }
          # 暂存只该带进目标平台那一个二进制;混进 darwin / linux 的说明 stage_engine_ts.js 的过滤挂了
          $wrong = @($nodes | Where-Object { $_.Name -match 'darwin|linux' })
          if ($wrong.Count -gt 0) { Write-Host "::error::混进了别的平台的原生模块:$($wrong.Name -join ', ')"; exit 1 }

      - name: 用安装包里的 Electron 拉起安装包里的引擎
        working-directory: desktop
        shell: pwsh
        run: |
          $app = (Resolve-Path dist/win-unpacked).Path
          $env:DAFRI_PROMPT_DIR = "$app\resources\engine\prompts"
          node tools/smoke_engine_ts.js "$app\resources\engine-ts" --runner "$app\IBKR-Assistant.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 启动应用 30 秒:不闪退,主进程拉起了引擎
        working-directory: desktop
        shell: pwsh
        run: |
          $app = (Resolve-Path dist/win-unpacked).Path
          $p = Start-Process -FilePath "$app\IBKR-Assistant.exe" -PassThru
          $engine = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { Write-Host "::error::应用在第 $i 秒退出(退出码 $($p.ExitCode))"; exit 1 }
            # 打包版的引擎是"应用本体 + ELECTRON_RUN_AS_NODE",进程名就是 IBKR-Assistant.exe,认命令行里的 cli.js rpc
            $found = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*cli.js*rpc*' })
            if ($found.Count -gt 0) { $engine = $true }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $log = "$env:APPDATA\IBKR-Assistant\logs\main.log"
          if (Test-Path $log) { "--- main.log"; Get-Content $log -Tail 40 }
          if (-not $engine) { Write-Host "::error::30 秒内没看到引擎子进程"; exit 1 }
          "应用存活 30 秒,引擎子进程已起来"

      - uses: actions/upload-artifact@v7
        with:
          name: IBKR-Assistant-win-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
          retention-days: 30
          if-no-files-found: error

  # 只有推 v* 标签的那次才发布:两个包都打成功了,才一起挂到 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dmg, exe]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 发版闸门(desktop/tools/check_release.js):标签与版本号对得上、CHANGELOG 里有这一版、条款文本里没有留着占位符、
      # 示例配置的闸门是关的、随包的开源组件许可都在白名单里。任何一条不过就不发。
      # 许可那一条要读两个工程的 node_modules,所以先装依赖(不下 Electron 二进制)
      - name: 发版闸门
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: |
          set -euo pipefail
          (cd engine-ts && npm ci)
          (cd desktop && npm ci)
          node desktop/tools/check_release.js --tag "$GITHUB_REF_NAME" --notes > "$RUNNER_TEMP/changes.md"

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.blockmap' \) | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::没有可发布的产物"; exit 1; }
          # 校验和:下载的人拿它核对安装包没有被换过、没有下坏(shasum -a 256 -c SHA256SUMS.txt)
          mkdir -p out
          for f in "${files[@]}"; do cp "$f" out/; done
          (cd out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # 更新说明 = CHANGELOG.md 里这一版的那一节 + 每一版都一样的安装提示。「关于 → 更新」显示的就是这段话
          {
            cat "$RUNNER_TEMP/changes.md"
            printf '\n---\n\n'
            printf '**macOS**(Apple Silicon,需 macOS 12 以上):`IBKR-Assistant-*-mac-arm64.dmg`。没有开发者证书时是 ad-hoc 签名、未公证,首次打开会提示无法验证开发者:到「系统设置 → 隐私与安全性」点「仍要打开」。Intel Mac 不支持。\n\n'
            printf '**Windows** x64:`IBKR-Assistant-*-win-x64.exe`。未签名,SmartScreen 拦下时「更多信息 → 仍要运行」。\n\n'
            printf '两个包都自带交易引擎,目标机器不需要装 Node 或 Python。安装包的 SHA-256 在 `SHA256SUMS.txt` 里。\n\n'
            printf '用之前:IBKR 的 TWS 或 IB Gateway 要登录并打开 API;自备一个大模型 API Key。**请先只接模拟账户。**\n'
          } > "$RUNNER_TEMP/notes.md"
          # 发出去的版本不再改:同一个标签已经有 Release 就停下。要改就发一个新的补丁版本——
          # 悄悄换掉一个已经有人下载过的安装包,校验和、更新提示、问题复现都会对不上
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME 已经存在。发出去的版本不覆盖:请改版本号、打新标签"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "IBKR-Assistant ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
