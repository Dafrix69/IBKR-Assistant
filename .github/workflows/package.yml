name: 安装包

# macOS(DMG,Apple Silicon)与 Windows(NSIS,x64)安装包。
#   - 手动:Actions → 安装包 → Run workflow(或 gh workflow run package.yml --ref main)
#   - 推 v* 标签:两个包一起出,跑完自动挂到对应的 Release
#   - 改到打包相关文件的 PR:先打一遍,确认还能出包
# 每次运行的产物都在 Artifacts 里(DafriTrading-mac-arm64 / DafriTrading-win-x64),保留 30 天;
# 打标签的那次还会发到 Releases。两个包都未签名:
#   macOS 未公证,首次打开右键 → 打开,或 xattr -dr com.apple.quarantine "/Applications/Dafri Trading.app"
#   Windows 会弹 SmartScreen,「更多信息 → 仍要运行」

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/package.yml'
      - 'desktop/package.json'
      - 'desktop/build/**'
      - 'desktop/tools/stage_engine_ts.js'
      - 'desktop/tools/smoke_engine_ts.js'

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    # macos-latest 是 Apple Silicon,和 dist:mac 的 --arm64 一致;原生模块(better-sqlite3、@napi-rs/keyring)按本机平台装
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # package.json 里 mac.identity 为 null:不签名。别让 electron-builder 去钥匙串里自动找证书
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 ci.yml 一致:better-sqlite3 13 要 Node >= 22,Electron 40 内置的也是 Node 24
          node-version: 24
          cache: npm
          cache-dependency-path: |
            engine-ts/package-lock.json
            desktop/package-lock.json

      - name: 装引擎依赖
        working-directory: engine-ts
        run: npm ci

      - name: 装桌面端依赖(含 Electron 二进制,冒烟要用)
        working-directory: desktop
        run: npm ci

      - name: 打包 DMG(界面构建 → 暂存引擎 → 冒烟 → electron-builder)
        working-directory: desktop
        run: npm run dist:mac

      - name: 核对安装包:DMG 完整、主程序与引擎原生模块都是 arm64
        working-directory: desktop
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          APP="dist/mac-arm64/Dafri Trading.app"
          echo "DMG: $DMG($(du -h "$DMG" | cut -f1))"
          hdiutil verify "$DMG"
          # 架构判断不走 "| grep -q":开着 pipefail 时 grep 提前退出会让上游吃 SIGPIPE,被误判成失败
          archs=$(lipo -archs "$APP/Contents/MacOS/Dafri Trading")
          echo "主程序: $archs"
          [[ " $archs " == *" arm64 "* ]] || { echo "::error::主程序不是 arm64:$archs"; exit 1; }
          # 路径里有空格("Dafri Trading.app"),逐个读 find 的输出,不能 for f in $(find …)
          count=0
          while IFS= read -r -d '' f; do
            archs=$(lipo -archs "$f")
            echo "${f#"$APP/"}: $archs"
            [[ " $archs " == *" arm64 "* ]] || { echo "::error::原生模块不是 arm64:$f"; exit 1; }
            count=$((count + 1))
          done < <(find "$APP/Contents/Resources/engine-ts/node_modules" -name '*.node' -print0)
          [ "$count" -gt 0 ] || { echo "::error::安装包里一个原生模块都没有,暂存步骤可能漏了"; exit 1; }
          codesign -dv "$APP" 2>&1 || true

      - name: 用安装包里的 Electron 拉起安装包里的引擎
        working-directory: desktop
        run: |
          APP="$PWD/dist/mac-arm64/Dafri Trading.app"
          DAFRI_PROMPT_DIR="$APP/Contents/Resources/engine/prompts" \
            node tools/smoke_engine_ts.js "$APP/Contents/Resources/engine-ts" --runner "$APP/Contents/MacOS/Dafri Trading"

      - name: 启动应用 30 秒:不闪退,主进程拉起了引擎
        working-directory: desktop
        run: |
          set -uo pipefail
          APP="$PWD/dist/mac-arm64/Dafri Trading.app"
          # DAFRI_SKIP_MOVE:不弹"移到应用程序"的对话框(那是从 DMG 里双击运行时才该有的)
          DAFRI_SKIP_MOVE=1 "$APP/Contents/MacOS/Dafri Trading" > app.log 2>&1 &
          pid=$!
          engine=0
          for i in $(seq 1 30); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::应用在第 ${i} 秒退出"
              cat app.log
              exit 1
            fi
            pgrep -f "engine-ts/dist/src/cli.js rpc" >/dev/null && engine=1
          done
          kill "$pid" 2>/dev/null || true
          LOG="$HOME/Library/Application Support/Dafri Trading/logs/main.log"
          if [ -f "$LOG" ]; then echo "--- main.log"; tail -40 "$LOG"; fi
          if [ "$engine" != 1 ]; then echo "::error::30 秒内没看到引擎子进程"; exit 1; fi
          echo "应用存活 30 秒,引擎子进程已起来"

      - uses: actions/upload-artifact@v4
        with:
          name: DafriTrading-mac-arm64
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.dmg.blockmap
          retention-days: 30
          if-no-files-found: error

  exe:
    # windows-latest 出 NSIS 安装器(dist:win 的 --x64);原生模块按本机平台装
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 ci.yml 一致:better-sqlite3 13 要 Node >= 22,Electron 40 内置的也是 Node 24
          node-version: 24
          cache: npm
          cache-dependency-path: |
            engine-ts/package-lock.json
            desktop/package-lock.json

      - name: 装引擎依赖
        working-directory: engine-ts
        run: npm ci

      - name: 装桌面端依赖(含 Electron 二进制,冒烟要用)
        working-directory: desktop
        run: npm ci

      - name: 打包 EXE(界面构建 → 暂存引擎 → 冒烟 → electron-builder)
        working-directory: desktop
        run: npm run dist:win

      - name: 核对安装包:安装器在,解包目录里只有 win32-x64 的原生模块
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::没有出 exe"; exit 1 }
          "安装器: $($exe.Name)($([math]::Round($exe.Length / 1MB)) MB)"
          $app = (Resolve-Path dist/win-unpacked).Path
          $nodes = @(Get-ChildItem "$app\resources\engine-ts\node_modules" -Recurse -Filter *.node)
          if ($nodes.Count -eq 0) { Write-Host "::error::安装包里一个原生模块都没有,暂存步骤可能漏了"; exit 1 }
          foreach ($n in $nodes) { "$($n.FullName.Substring($app.Length + 1)): $([math]::Round($n.Length / 1KB)) KB" }
          # 暂存只该带进目标平台那一个二进制;混进 darwin / linux 的说明 stage_engine_ts.js 的过滤挂了
          $wrong = @($nodes | Where-Object { $_.Name -match 'darwin|linux' })
          if ($wrong.Count -gt 0) { Write-Host "::error::混进了别的平台的原生模块:$($wrong.Name -join ', ')"; exit 1 }

      - name: 用安装包里的 Electron 拉起安装包里的引擎
        working-directory: desktop
        shell: pwsh
        run: |
          $app = (Resolve-Path dist/win-unpacked).Path
          $env:DAFRI_PROMPT_DIR = "$app\resources\engine\prompts"
          node tools/smoke_engine_ts.js "$app\resources\engine-ts" --runner "$app\Dafri Trading.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 启动应用 30 秒:不闪退,主进程拉起了引擎
        working-directory: desktop
        shell: pwsh
        run: |
          $app = (Resolve-Path dist/win-unpacked).Path
          $p = Start-Process -FilePath "$app\Dafri Trading.exe" -PassThru
          $engine = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { Write-Host "::error::应用在第 $i 秒退出(退出码 $($p.ExitCode))"; exit 1 }
            # 打包版的引擎是"应用本体 + ELECTRON_RUN_AS_NODE",进程名就是 Dafri Trading.exe,认命令行里的 cli.js rpc
            $found = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*cli.js*rpc*' })
            if ($found.Count -gt 0) { $engine = $true }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $log = "$env:APPDATA\Dafri Trading\logs\main.log"
          if (Test-Path $log) { "--- main.log"; Get-Content $log -Tail 40 }
          if (-not $engine) { Write-Host "::error::30 秒内没看到引擎子进程"; exit 1 }
          "应用存活 30 秒,引擎子进程已起来"

      - uses: actions/upload-artifact@v4
        with:
          name: DafriTrading-win-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
          retention-days: 30
          if-no-files-found: error

  # 只有推 v* 标签的那次才发布:两个包都打成功了,才一起挂到 Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dmg, exe]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 标签与 desktop/package.json 的版本必须对得上
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./desktop/package.json').version")
          echo "标签 $tag / package.json $pkg"
          # 对不上就停:产物文件名带的是 package.json 的版本号,发出去会和标签不一致
          [ "$tag" = "$pkg" ] || { echo "::error::标签 v$tag 与 desktop/package.json 的 $pkg 对不上"; exit 1; }

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.blockmap' \) | sort)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::没有可发布的产物"; exit 1; }
          notes=$'**macOS**(Apple Silicon,需 macOS 12 以上):`DafriTrading-*-mac-arm64.dmg`。未签名未公证,首次打开右键 → 打开,或 `xattr -dr com.apple.quarantine "/Applications/Dafri Trading.app"`。Intel Mac 不支持。\n\n**Windows** x64:`DafriTrading-*-win-x64.exe`。未签名,SmartScreen 拦下时「更多信息 → 仍要运行」。\n\n两个包都自带交易引擎,目标机器不需要装 Node 或 Python。\n\n用之前:IBKR 的 TWS 或 IB Gateway 要登录并打开 API;自备一个大模型 API Key(Anthropic 或 OpenAI 兼容端点)。建议先只接模拟账户。'
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在,补传资产(同名覆盖)"
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Dafri Trading ${GITHUB_REF_NAME#v}" \
              --notes "$notes"
          fi
