name: native

# Qt / C++ 重写(native/,docs/briefs/qt-rewrite.md)。单独一条工作流:它还在阶段 0,
# 先看它在两个平台上稳不稳,再决定要不要并进 ci.yml 当必过项。
on:
  push:
    branches: [qt]
    paths: ["native/**", "engine-ts/src/contract/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "engine-ts/src/contract/**", ".github/workflows/native.yml"]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # 本机开发用 Homebrew 的 Qt 6.12;CI 装 6.10.3:装 Qt 的 aqtinstall(3.3)读不了 Windows 上 6.11 起的仓库目录
      # (2026-10-18 核过:mac 的 6.12.0 读得到,Windows 的 6.11.3 / 6.12.0 都报取不到 Updates.xml)。代码只要 6.5 起
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          cache: true
      - name: MSVC 的编译环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: 配置
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: 编译
        run: cmake --build build
      - name: 测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  # 内存错误、未定义行为、数据竞争各一遍(brief「C++ 自己的那一套」)。只在 macOS 上:MSVC 没有 UBSan / TSan
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        flag: [IBKR_SANITIZE, IBKR_TSAN]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          cache: true
      - name: 配置
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -D${{ matrix.flag }}=ON
      - name: 编译
        run: cmake --build build
      - name: 测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
