name: native

# Qt / C++ 版(native/):qt 分支上唯一的一条工作流。Electron 版与 engine-ts 已删(main 分支与
# archive/electron-final-2026-10-22 还留着它们)。
on:
  push:
    branches: [qt]
    paths: ["native/**", "prompts/**", "config/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "prompts/**", "config/**", ".github/workflows/native.yml"]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # 本机开发用 Homebrew 的 Qt 6.12;CI 装 6.10.3:装 Qt 的 aqtinstall(3.3)读不了 Windows 上 6.11 起的仓库目录
      # (2026-10-18 核过:mac 的 6.12.0 读得到,Windows 的 6.11.3 / 6.12.0 都报取不到 Updates.xml)。代码只要 6.5 起
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          cache: true
      - name: MSVC 的编译环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: 配置
        run: cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: 编译
        run: cmake --build build
      - name: 测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

