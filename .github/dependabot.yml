# 依赖的例行升级。Qt 与 C++ 的依赖(Qt 本身、third_party/sqlite3)不走这里;GitHub Actions 自己算一份依赖。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # 四个 action 改的是相邻的几行,分开提 PR 会互相冲突(2026-09 那一批的 #6 与 #9)
      actions:
        patterns: ['*']
